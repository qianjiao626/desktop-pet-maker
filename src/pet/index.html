<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
<title>桌宠</title>
<link rel="stylesheet" href="./pet.css" />
</head>
<body>
  <div class="bubble" id="bubble" hidden><span id="bubbleText"></span></div>
  <canvas id="stage"></canvas>

  <div class="menu" id="menu" hidden>
    <div class="mi" data-act="bottom">回到屏幕底部</div>
    <div class="mi" data-act="bubble">说一句话</div>
    <div class="mi" data-act="top">切换置顶</div>
<div class="mi" data-act="clickthrough">切换鼠标穿透</div>
    <div class="mi" id="miNextClip" data-act="nextclip" hidden>换个动作</div>
    <div class="sep"></div>
    <div class="mi danger" data-act="close">退出桌宠 <span class="kbd">Ctrl+Alt+Q</span></div>
  </div>

  <div class="mem-notice" id="memNotice" hidden></div>
  <div class="err" id="err" hidden></div>
  <script type="module" src="./pet.js"></script>
</body>
</html>
